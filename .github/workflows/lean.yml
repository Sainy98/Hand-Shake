name: Independent b-matching development
on:
  push:
    branches: [golden-bmatching-independent-20261013]
jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: independent-bmatching-433rc1-9944fe2973b8dc0b86949101ed98232c07cd54a0
      - name: Install toolchain manager
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve exact environment
        run: |
          lean --version
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "9944fe2973b8dc0b86949101ed98232c07cd54a0"
          lake exe cache get
      - name: Check current independently authored lemmas
        run: |
          lake env lean TuringTask/Basic.lean
          lake build
          lake env lean Verify.lean
      - name: Upload development logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-manifest
          path: lake-manifest.json
