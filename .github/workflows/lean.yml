name: Independent proof development
on:
  push:
    branches: [golden-independent]
  pull_request:
    branches: [main]
jobs:
  verify_helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: turing-lean433rc1-mathlib-9944fe2973b8dc0b86949101ed98232c07cd54a0
      - name: Install elan if needed
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check pinned toolchain and dependency
        run: |
          lean --version
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "9944fe2973b8dc0b86949101ed98232c07cd54a0"
          lake exe cache get
      - name: Compile independently written helpers
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          lake env lean TuringTask/Basic.lean
          lake env lean Verify.lean 2>&1 | tee helper-verification.log
      - name: Audit helper source
        run: |
          python3 - <<'PY'
          import pathlib,re
          for p in pathlib.Path('.').glob('TuringTask/**/*.lean'):
              text=p.read_text()
              assert not re.search(r'\b(sorry|admit|native_decide|unsafe|implemented_by)\b|@\[extern\]|^\s*axiom\s',text,re.M), str(p)
          PY
