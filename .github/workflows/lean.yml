name: Pinned Lean verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pinned-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Confirm pinned Lean
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version

      - name: Resolve exact Mathlib commit
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "9944fe2973b8dc0b86949101ed98232c07cd54a0"

      - name: Fetch Mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Compile current development
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build
          lake env lean TuringTask/Basic.lean

      - name: Reject proof escapes (development audit)
        continue-on-error: true
        run: |
          if grep -R -n -E '\bsorry\b|\badmit\b|native_decide|implemented_by|@\[extern\]|\bunsafe\b' --include='*.lean' TuringTask TuringTask.lean Verify.lean; then
            echo "Forbidden proof escape found."
            exit 1
          fi

      - name: Verify current theorem
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean Verify.lean | tee verification.log
